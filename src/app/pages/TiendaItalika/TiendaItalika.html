<div class="flex flex-col h-full">
  <h1 class="text-2xl font-bold mb-4">Login - Tienda Italika</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium mb-1">Usuario</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-500"
        [class.border-red-500]="username?.invalid && username?.touched"
        placeholder="Ingresa tu usuario">

      <div *ngIf="username?.invalid && username?.touched" class="text-red-500 text-sm mt-1">
        <span *ngIf="username?.errors?.['required']">El usuario es requerido</span>
        <span *ngIf="username?.errors?.['minlength']">Mínimo 3 caracteres</span>
      </div>
    </div>

    <div class="mb-6">
      <label for="password" class="block text-sm font-medium mb-1">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-500"
        [class.border-red-500]="password?.invalid && password?.touched"
        placeholder="Ingresa tu contraseña">

      <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-sm mt-1">
        <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
        <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition-colors disabled:opacity-50">
      Iniciar Sesión
    </button>
  </form>
</div>
<router-outlet></router-outlet>
