<div class="chat-item h-full flex flex-col bg-white">

  <div class="mensajes flex-1 p-4 border-3 border-gray-200 rounded mb-4 m-4 overflow-y-auto">
    <div class="text-center py-8 text-gray-500">
      Los mensajes aparecerán aquí...
    </div>
  </div>

  <div class="caja-texto-enviar flex-shrink-0">
    <div class="caja-texto p-4">
      <textarea
        class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        rows="3"
        placeholder="Escribe tu mensaje...">
      </textarea>
    </div>
    <div class="caja-enviar p-4">
      <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-all duration-200">
        Enviar
      </button>
    </div>
  </div>

</div>
